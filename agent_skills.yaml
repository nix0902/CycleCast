# ==========================================
# ЯЗЫКИ И ТЕХНОЛОГИИ
# ==========================================

languages:
  # Основные языки программирования
  programming:
    python:
      name: "Python"
      extensions: [".py", ".pyw", ".pyi"]
      frameworks: ["Django", "Flask", "FastAPI", "asyncio", "NumPy", "Pandas", "PyTorch"]
      
    typescript:
      name: "TypeScript"
      extensions: [".ts", ".tsx"]
      frameworks: ["React", "Next.js", "Vue", "Angular", "Node.js", "Express"]
      
    javascript:
      name: "JavaScript"
      extensions: [".js", ".jsx", ".mjs", ".cjs"]
      frameworks: ["React", "Vue", "Angular", "Node.js", "Express", "Next.js"]
      
    go:
      name: "Go"
      extensions: [".go"]
      frameworks: ["Gin", "Echo", "gRPC", "Clean Architecture"]
      
    rust:
      name: "Rust"
      extensions: [".rs"]
      frameworks: ["Tokio", "Actix", "Rocket", "Cargo"]
      
    css:
      name: "CSS"
      extensions: [".css", ".scss", ".sass", ".less"]
      frameworks: ["Tailwind CSS", "Bootstrap", "styled-components", "CSS Modules"]
      
    powershell:
      name: "PowerShell"
      extensions: [".ps1", ".psm1", ".psd1"]
      frameworks: []
      
    bash:
      name: "Bash/Shell"
      extensions: [".sh", ".bash", ".zsh"]
      frameworks: []
  
  # Категории навыков
  skill_categories:
    - name: "programming"
      skills: ["python", "typescript", "javascript", "go", "rust"]
    - name: "styling"
      skills: ["css"]
    - name: "scripting"
      skills: ["bash", "powershell"]
    - name: "data"
      skills: ["sql", "database"]
    - name: "infrastructure"
      skills: ["docker", "kubernetes", "terraform"]
    - name: "vision"
      skills: ["ui-recognition", "chart-recognition", "candlestick-patterns", "chart-patterns"]
    - name: "financial"
      skills: ["candlestick-analysis", "technical-analysis", "cycle-analysis"]

  # ========================================
  # ВИЗУАЛЬНЫЕ НАВЫКИ (Vision/VLM)
  # ========================================
  vision_skills:
    ui-recognition:
      name: "UI Recognition"
      description: "Распознавание элементов пользовательского интерфейса"
      capabilities:
        - "Identify UI components (buttons, forms, modals)"
        - "Read text from screenshots"
        - "Analyze layout and structure"
        - "Detect interactive elements"
      use_cases:
        - "Frontend debugging from screenshots"
        - "UI/UX analysis"
        - "Accessibility review"
        - "Design-to-code conversion"

    chart-recognition:
      name: "Chart Recognition"
      description: "Распознавание финансовых графиков"
      capabilities:
        - "Identify chart types (line, bar, candlestick)"
        - "Read axis labels and values"
        - "Extract data points from images"
        - "Detect trend lines and levels"
      use_cases:
        - "Chart data extraction"
        - "Visual analysis automation"
        - "Historical data digitization"

    candlestick-patterns:
      name: "Candlestick Patterns Recognition"
      description: "Распознавание свечных паттернов"
      patterns:
        # Односвечные паттерны
        single_candle:
          - name: "Doji"
            description: "Тело свечи очень маленькое, цены открытия и закрытия почти равны"
            signal: "Нерешительность, возможный разворот"
          - name: "Hammer"
            description: "Маленькое тело сверху, длинная нижняя тень"
            signal: "Бычий разворот при нисходящем тренде"
          - name: "Inverted Hammer"
            description: "Маленькое тело снизу, длинная верхняя тень"
            signal: "Бычий разворот"
          - name: "Hanging Man"
            description: "Похож на Hammer, но при восходящем тренде"
            signal: "Медвежий разворот"
          - name: "Shooting Star"
            description: "Маленькое тело снизу, длинная верхняя тень при uptrend"
            signal: "Медвежий разворот"
          - name: "Marubozu"
            description: "Свеча без теней"
            signal: "Сильное давление быков/медведей"
          - name: "Spinning Top"
            description: "Маленькое тело, длинные тени с обеих сторон"
            signal: "Нерешительность"
        
        # Двухсвечные паттерны
        double_candle:
          - name: "Bullish Engulfing"
            description: "Бычья свеча полностью поглощает предыдущую медвежью"
            signal: "Бычий разворот"
          - name: "Bearish Engulfing"
            description: "Медвежья свеча полностью поглощает предыдущую бычью"
            signal: "Медвежий разворот"
          - name: "Tweezer Top"
            description: "Две свечи с одинаковыми максимумами"
            signal: "Медвежий разворот"
          - name: "Tweezer Bottom"
            description: "Две свечи с одинаковыми минимумами"
            signal: "Бычий разворот"
          - name: "Harami"
            description: "Маленькая свеча внутри предыдущей большой"
            signal: "Возможный разворот"
          - name: "Piercing Line"
            description: "Бычья свеча закрывается выше середины предыдущей медвежьей"
            signal: "Бычий разворот"
          - name: "Dark Cloud Cover"
            description: "Медвежья свеча закрывается ниже середины предыдущей бычьей"
            signal: "Медвежий разворот"
        
        # Трёхсвечные паттерны
        triple_candle:
          - name: "Morning Star"
            description: "Медвежья, маленькая, бычья свеча"
            signal: "Бычий разворот (сильный)"
          - name: "Evening Star"
            description: "Бычья, маленькая, медвежья свеча"
            signal: "Медвежий разворот (сильный)"
          - name: "Three White Soldiers"
            description: "Три подряд растущие бычьи свечи"
            signal: "Сильный бычий тренд"
          - name: "Three Black Crows"
            description: "Три подряд падающие медвежьи свечи"
            signal: "Сильный медвежий тренд"
          - name: "Three Inside Up"
            description: "Harami + подтверждающая бычья свеча"
            signal: "Бычий разворот"
          - name: "Three Inside Down"
            description: "Harami + подтверждающая медвежья свеча"
            signal: "Медвежий разворот"

    chart-patterns:
      name: "Chart Patterns Recognition"
      description: "Распознавание графических паттернов"
      patterns:
        # Разворотные паттерны
        reversal:
          - name: "Head and Shoulders"
            description: "Три пика: плечо-голова-плечо"
            signal: "Медвежий разворот"
            components: ["Left Shoulder", "Head", "Right Shoulder", "Neckline"]
          - name: "Inverse Head and Shoulders"
            description: "Перевёрнутая голова и плечи"
            signal: "Бычий разворот"
          - name: "Double Top"
            description: "Два пика на одном уровне"
            signal: "Медвежий разворот"
          - name: "Double Bottom"
            description: "Два дна на одном уровне"
            signal: "Бычий разворот"
          - name: "Triple Top"
            description: "Три пика на одном уровне"
            signal: "Медвежий разворот"
          - name: "Triple Bottom"
            description: "Три дна на одном уровне"
            signal: "Бычий разворот"
          - name: "Rounding Bottom"
            description: "U-образное дно"
            signal: "Бычий разворот"
        
        # Паттерны продолжения
        continuation:
          - name: "Flag"
            description: "Короткий канал против тренда"
            signal: "Продолжение тренда"
          - name: "Pennant"
            description: "Симметричный треугольник после резкого движения"
            signal: "Продолжение тренда"
          - name: "Ascending Triangle"
            description: "Растущая нижняя линия, горизонтальное сопротивление"
            signal: "Бычий пробой"
          - name: "Descending Triangle"
            description: "Падающая верхняя линия, горизонтальная поддержка"
            signal: "Медвежий пробой"
          - name: "Symmetrical Triangle"
            description: "Сходящиеся линии тренда"
            signal: "Пробой в направлении тренда"
          - name: "Rectangle"
            description: "Боковой канал"
            signal: "Продолжение тренда"
          - name: "Wedge"
            description: "Сходящиеся линии, Rising (медвежий) или Falling (бычий)"
            signal: "Разворот"
          - name: "Cup and Handle"
            description: "Чашка с ручкой"
            signal: "Бычий пробой"

